name: "📝 Content improvement"
description: "Fix or clarify an existing lesson or quiz."
title: "[Content] "
labels: ["content", "documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **SystemDesigner**! 💙

        Use this form to **fix or clarify an existing lesson or quiz**. For a brand-new
        lesson, quiz, calculator, or case study, use the **Propose new content** form instead.

        Two faster paths also exist on every lesson page:
        - **Edit this page on GitHub** — deep-links straight to the file editor.
        - **Suggest an improvement** — opens this prefilled form.

        Before submitting, please skim the
        [Content Guide](https://github.com/alibad/systemdesigner/blob/main/docs/CONTENT_GUIDE.md).
        Core editorial principle: **"Explain before you dive deep"** — every concept opens with a plain-language
        *"What is [Concept]?"* intro a beginner can grasp in 15–30 seconds, then progressive disclosure into trade-offs.
  - type: input
    id: page-url
    attributes:
      label: "Which page or URL?"
      description: "Paste the live URL (e.g. https://systemdesigner.net/fundamentals/caching) or the registry path (/section/slug)."
      placeholder: "https://systemdesigner.net/fundamentals/caching"
    validations:
      required: false
  - type: textarea
    id: whats-wrong
    attributes:
      label: "What's wrong or could be better?"
      description: "Describe the inaccuracy, confusing wording, missing context, broken example, or quiz issue. Be concrete."
      placeholder: "The 'What is sharding?' intro jumps straight into hash vs range partitioning without defining sharding first."
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: "Suggested fix"
      description: "How would you reword, restructure, or correct it? A draft sentence or paragraph is hugely helpful."
      placeholder: "Open with: 'Sharding splits one large database into smaller, independent pieces (shards) spread across machines...' then go into strategies."
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: "Source / reference"
      description: "Optional: a link or citation that backs up your suggestion (docs, paper, blog post)."
      placeholder: "https://example.com/authoritative-source"
    validations:
      required: false
  - type: checkboxes
    id: read-guide
    attributes:
      label: "Confirmation"
      options:
        - label: "I read the [Content Guide](https://github.com/alibad/systemdesigner/blob/main/docs/CONTENT_GUIDE.md)."
          required: true
