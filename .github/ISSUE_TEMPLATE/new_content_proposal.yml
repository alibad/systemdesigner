name: "✨ Propose new content"
description: "Propose a new lesson, quiz, calculator, or case study."
title: "[New content] "
labels: ["content", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Love that you want to teach something new! 🚀

        Use this form to propose a **new** lesson, quiz, calculator, or case study. To fix or clarify
        something that already exists, use the **Content improvement** form instead.

        New content is registered in `lib/content-registry.ts` (the single source of truth), with bodies at
        `content/entries/[section]/[slug]/index.mdoc` and quizzes in `lib/quiz-bank/all-quizzes.json` or the entry's `quiz/` directory. See the
        [Content Guide](https://github.com/alibad/systemdesigner/blob/main/docs/CONTENT_GUIDE.md) for the full authoring workflow.
  - type: input
    id: proposed-title
    attributes:
      label: "Proposed title"
      description: "A clear, specific title for the new content."
      placeholder: "Consistent Hashing for Sharded Caches"
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: "Which section?"
      description: "Pick the section this content belongs to."
      options:
        - "technology"
        - "genai"
        - "ml-systems"
        - "fundamentals"
        - "practice"
        - "reference"
        - "tools"
        - "case-studies"
    validations:
      required: true
  - type: textarea
    id: what-it-teaches
    attributes:
      label: "What it teaches & why it matters"
      description: "Summarize the core concept, who it's for, and why it deserves a place in the curriculum. Lead with motivation."
      placeholder: "Teaches how consistent hashing minimizes key remapping when nodes join or leave a cluster — essential for designing resilient distributed caches and databases."
    validations:
      required: true
  - type: textarea
    id: prerequisites-related
    attributes:
      label: "Prerequisites / related content"
      description: "List existing lessons a reader should know first, plus related topics to cross-link (use registry IDs or paths where you can)."
      placeholder: "Prerequisites: hashing-basics, caching. Related: database-sharding, load-balancing."
    validations:
      required: false
  - type: dropdown
    id: willing-to-draft
    attributes:
      label: "Are you willing to draft it?"
      description: "No pressure either way — proposals are valuable even if you can't write them."
      options:
        - "Yes — I'll write the draft"
        - "Maybe — with some guidance"
        - "No — I'm proposing the idea for someone else to pick up"
    validations:
      required: true
