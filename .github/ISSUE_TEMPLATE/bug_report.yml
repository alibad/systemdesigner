name: "🐞 Bug report"
description: "Report something that's broken or behaving incorrectly."
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! 🙏 Clear, reproducible reports get fixed fastest.

        If your issue is about wording or accuracy in a lesson rather than a software defect,
        the **Content improvement** form is a better fit.
  - type: input
    id: page-url
    attributes:
      label: "Page URL"
      description: "Where did the bug happen?"
      placeholder: "https://systemdesigner.net/tools/latency-calculator"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "List the exact steps so we can see it too."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What did you expect to happen?"
      placeholder: "The quiz should advance to the next question after I select an answer."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      description: "What actually happened?"
      placeholder: "The page froze and the console showed a TypeError."
    validations:
      required: true
  - type: input
    id: browser-os
    attributes:
      label: "Browser & OS"
      description: "Include versions where you can."
      placeholder: "Chrome 124 on macOS 14.5"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots or recordings"
      description: "Optional but very helpful. Drag-and-drop images or videos here."
    validations:
      required: false
