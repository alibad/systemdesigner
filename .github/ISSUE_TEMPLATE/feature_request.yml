name: "💡 Feature request"
description: "Suggest a new feature or improvement to the platform."
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea to make **SystemDesigner** better! ✨

        This form is for **platform/product features** (UI, tooling, infrastructure, learning experience).
        To propose a new lesson, quiz, calculator, or case study, use the **Propose new content** form instead.

        Have an open-ended idea or want to discuss first? Start a thread in
        [GitHub Discussions](https://github.com/alibad/systemdesigner/discussions).
  - type: textarea
    id: problem
    attributes:
      label: "What's the problem?"
      description: "Describe the pain point or unmet need. What are you trying to do, and what gets in the way?"
      placeholder: "I can't tell which lessons I've completed when I'm signed out, so I lose my place between visits."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
      description: "Describe what you'd like to see happen."
      placeholder: "Persist progress in local storage for anonymous users, then merge it on sign-in."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Any other approaches or workarounds you've thought about?"
      placeholder: "A simple 'mark as read' bookmark, or an export/import of progress as JSON."
    validations:
      required: false
