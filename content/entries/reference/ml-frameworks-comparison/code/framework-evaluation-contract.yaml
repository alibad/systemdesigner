workload:
  model: representative-ranking-model
  dataset_snapshot: evaluation-2026-07-23
  batch_sizes: [1, 32, 128]
  precisions: [fp32, bf16]
  seed: 1701

targets:
  - name: training-gpu
    device: documented-accelerator-shape
  - name: production-runtime
    device: documented-serving-shape

gates:
  numerical_parity:
    max_absolute_error: 0.0001
    product_decision_match: required
  performance:
    measure: [compile_time, p50_latency, p99_latency, peak_memory, throughput]
    warmup_iterations: 20
    measured_iterations: 200
  operations:
    verify: [artifact_load, rollback, unsupported_operator, out_of_memory]

evidence:
  record: [framework_version, compiler_version, driver_version, artifact_hash]
