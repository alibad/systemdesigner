release: checkout-api-2026-07-18
cohort: logged-random-eligible-users
baseline: checkout-api-stable

stages:
  - traffic: 1
    observe: 10m
  - traffic: 10
    observe: 15m
  - traffic: 25
    observe: 20m
  - traffic: 100

promote_when:
  candidate_error_rate_delta: "<= 0.5 percentage points"
  candidate_p95_latency_delta: "<= 50 ms"
  authorization_success_delta: ">= -0.2 percentage points"

on_breach:
  - freeze_promotion
  - route_new_requests_to: checkout-api-stable
  - preserve: [request_id, cohort, version, migration_state]
  - open_incident: release-rollback
