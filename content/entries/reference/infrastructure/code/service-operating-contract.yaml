service: checkout-api

ownership:
  application: checkout-team
  platform: runtime-platform
  data: orders-data
  observability: reliability-platform

objectives:
  availability: 99.9_percent_monthly
  latency_p95_ms: 300
  recovery_time_minutes: 30
  recovery_point_minutes: 5

deployment:
  shape: multi_zone
  zones: 3
  strategy: rolling_by_zone
  max_unavailable_zones: 1
  rollback_signal: checkout_error_budget_burn

dependencies:
  orders_database:
    critical: true
    timeout_ms: 120
    failure_behavior: fail_before_uncertain_write
  recommendation_api:
    critical: false
    timeout_ms: 50
    failure_behavior: omit_recommendations
  fulfillment_queue:
    critical: true
    failure_behavior: persist_outbox_and_retry

observability:
  user_sli: successful_checkout_ratio
  saturation_signals:
    - database_connection_wait
    - oldest_queue_message_seconds
  telemetry_freshness_alert_minutes: 3

recovery:
  regional_runbook: runbooks/checkout-region-failover
  backup_restore_exercise: quarterly
  last_restore_verified: 2026-06-12
  failover_requires:
    - named_incident_commander
    - fenced_primary_writer
    - verified_replication_checkpoint
    - healthy_secondary_telemetry
