decision: managed-container-runtime
status: proposed
review_trigger: traffic, residency, recovery target, or service contract changes

hard_gates:
  approved_regions: [primary-region, recovery-region]
  data_residency: required
  recovery_time_minutes: 30
  recovery_point_minutes: 5
  private_connectivity: required

workload_evidence:
  shape: long-running-api
  peak_requests_per_second: 2400
  p99_latency_target_ms: 180
  tested_failure: loss-of-primary-region

shortlist:
  category: managed-container-runtime
  provider_products: verify-current-products-in-target-regions
  rejected_categories:
    - name: managed-kubernetes
      reason: no platform team for cluster lifecycle and incident ownership
    - name: virtual-machines
      reason: host patching and replacement add work without a required capability

responsibility:
  provider: host-placement, physical-infrastructure, managed-control-plane
  customer: application, identity, data, scaling-policy, observability, recovery-test

accepted_coupling:
  capability: provider-managed-autoscaling
  benefit: avoids-routine-host-capacity-work
  exit_evidence: container-image, load-test, infrastructure-module, data-export-test

approval_evidence:
  - exact-region-service-and-quota-check
  - representative-load-test
  - timed-backup-restore
  - regional-failover-exercise
  - three-year-cost-and-egress-model
