version: gateway-policy-v18

identity:
  tenantSource: verified-principal
  rejectClientTenantClaims: true

admission:
  requiredChecks:
    - tenant
    - data-class
    - capability
    - residency
    - safety-profile
    - budget
    - route-health
  reserveMaximumOutputTokens: true

routes:
  - id: eu-governed-text
    adapter: south-content-v2
    secretRef: secret://ai/south/eu-production
    regions: [eu]
    capabilities: [text, json, stream]
    safetyProfile: restricted-v4
  - id: us-general-tools
    adapter: north-messages-v3
    secretRef: secret://ai/north/us-production
    regions: [us]
    capabilities: [text, tools, stream]
    safetyProfile: standard-v7

reliability:
  timeoutMs: 5000
  maxAttempts: 2
  retryAdapterClasses: [throttled, connection-reset, unavailable]
  respectRetryAfter: true
  propagateStreamCancellation: true
  circuit:
    key: [provider, model, region, operation]
    openFailureRatePct: 20
    halfOpenProbes: 3

caching:
  responseCache:
    allowedDataClasses: [public, standard]
    keyFields: [tenant, normalized-input, model-version, adapter-version, tool-set, safety-policy]
    neverStoreCanceledStreams: true

rollout:
  canaryPercent: 5
  hardRollbackGates: [policy-violation, safety-regression, quality-regression]

telemetry:
  logPromptsByDefault: false
  traceIds: [gateway-request-id, provider-attempt-id, provider-request-id]
  usageFields: [input-tokens, cached-input-tokens, output-tokens, estimated-cost]
