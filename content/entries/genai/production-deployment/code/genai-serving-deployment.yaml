apiVersion: apps/v1
kind: Deployment
metadata:
  name: answer-service
spec:
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: answer-service
  template:
    metadata:
      labels:
        app: answer-service
        release: "2026-07-23.1"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: gateway
          image: registry.example/answer-service@sha256:4f3a10e66ad89846826d81d4791cba6c7f9fa34d463509e2a8cc8bbadbe01251
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: answer-service-provider
                  key: api-key
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: answer-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: answer-service
  minReplicas: 4
  maxReplicas: 24
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: External
      external:
        metric:
          name: genai_pending_requests
        target:
          type: AverageValue
          averageValue: "4"
