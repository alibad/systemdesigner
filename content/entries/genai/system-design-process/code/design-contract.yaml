use_case:
  name: employee-policy-assistant
  user_outcome: "Grounded answer or explicit insufficient-evidence result"
  consequence: medium

requirements:
  modalities: [text]
  current_private_knowledge: true
  external_side_effects: false
  human_approval_required: false
  p95_latency_ms: 3200
  monthly_budget_usd: 2000

evidence_contract:
  required_sources: permission-filtered-policy-documents
  citations_required: true
  insufficient_evidence_outcome: abstain

release_gates:
  - task_success_by_intent
  - citation_support
  - permission_isolation
  - harmful_output_rate
  - p95_latency
  - cost_per_successful_task

failure_policy:
  retrieval_timeout: approved-links-only
  safety_service_unavailable: fail-closed
  model_deadline_exceeded: one-compact-tier-fallback
