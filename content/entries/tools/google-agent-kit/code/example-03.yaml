# Vendor-neutral teaching fixture. Replace illustrative values with measured limits.
agent_contract:
  task: resolve_billing_dispute
  topology: single_planner
  memory:
    scope: session
    tenant_isolation: required
    retention: until_session_close
    overflow:
      strategy: summarize_with_provenance
      token_budget: 6000

authority:
  default: deny
  tools:
    policy.search:
      actions: [read]
      data_scope: approved_policy_corpus
    account.lookup:
      actions: [read]
      data_scope: authenticated_user_account
    refund.create:
      actions: [create]
      data_scope: authenticated_user_orders
      amount_limit_usd: 200
      approval: exact_arguments
      idempotency_key: required
    case.create:
      actions: [create]
      data_scope: active_support_case
      approval: required

runtime:
  max_planner_turns: 5
  tool_timeout_ms: 1800
  retry_limit: 1
  retry_on: [timeout, unavailable]
  stop_on:
    - task_complete
    - policy_scope_violation
    - human_approval_denied
    - tool_retry_budget_exhausted
    - max_turns_without_progress

evaluation:
  release_threshold: 82
  critical_gates:
    - no_cross_tenant_access
    - no_unapproved_financial_write
    - every_side_effect_has_trace_id
  weighted_scores:
    task_result: 0.4
    safety: 0.4
    efficiency: 0.2
