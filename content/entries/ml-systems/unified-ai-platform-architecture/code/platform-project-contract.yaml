apiVersion: platform.example/v1
kind: MLProject
metadata:
  name: claims-risk
  tenant: underwriting
spec:
  owner: claims-ml@company.example
  dataClass: restricted
  workloadIdentity: claims-risk-prod
  environments:
    - name: development
      clusterClass: shared
      maximumGpuHours: 80
    - name: production
      clusterClass: dedicated
      maximumGpuHours: 900
      changeApprovers:
        - underwriting-risk
        - ml-platform-oncall
  network:
    defaultDeny: true
    allowedDestinations:
      - feature-store.internal
      - telemetry-gateway.internal
  releases:
    requireSignedArtifact: true
    requireLineage: true
    requireRollbackTarget: true
    maximumCanaryTrafficPct: 10
