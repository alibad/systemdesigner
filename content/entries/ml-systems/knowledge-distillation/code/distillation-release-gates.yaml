distillation:
  teacher_artifact: "registry://classifier/teacher/v17"
  student_initialization: "registry://classifier/student-base/v4"
  transfer_dataset: "dataset://classification-transfer/2026-07-01"
  temperature: 3.0
  teacher_weight: 0.55
  soft_loss: "kl_divergence_batchmean"
  label_loss: "cross_entropy"

evaluation:
  holdout_dataset: "dataset://classification-holdout/2026-07-01"
  overall_score_min: 91.0
  required_slice_score_min: 89.5
  calibration_error_max: 0.03

target_runtime:
  device_profile: "edge-gpu-v3"
  batch_size: 1
  p95_latency_ms_max: 10
  peak_memory_mb_max: 400

rollout:
  initial_canary_percent: 5
  rollback_artifact: "registry://classifier/student/v12"
  block_on_any_gate_failure: true
