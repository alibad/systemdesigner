# Kubernetes Deployment for Continual Learning Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: continual-learning-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: continual-learning
  template:
    metadata:
      labels:
        app: continual-learning
    spec:
      containers:
      - name: continual-learner
        image: ml-platform/continual-learning:v1.2.0
        resources:
          requests:
            memory: "8Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        env:
        - name: STRATEGY
          value: "ewc"
        - name: BUFFER_SIZE
          value: "50000"
        - name: LEARNING_RATE
          value: "0.001"
        - name: REDIS_URL
          value: "redis://redis-cluster:6379"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: model-storage
          mountPath: /models
        - name: memory-storage
          mountPath: /memory
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-pvc
      - name: memory-storage
        persistentVolumeClaim:
          claimName: memory-pvc
