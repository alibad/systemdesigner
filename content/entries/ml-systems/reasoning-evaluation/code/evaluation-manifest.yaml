evaluation:
  id: reasoning-release-v3
  construct: constraint-following under controlled prompt changes
  decision: release_gate
  benchmark_version: "3.0.0"
  protected_split: final

protocol:
  system_version: exact-model-or-artifact-id
  prompt_template_sha256: replace-with-recorded-hash
  temperature: 0
  max_output_tokens: 512
  reasoning_budget: fixed
  attempts_per_item: 1
  network_access: false
  tool_allowlist: []
  timeout_seconds: 45

scoring:
  final_answer: normalized_exact_match
  paired_relation: expected_same_or_different
  malformed_output: incorrect
  missing_output: incorrect
  scorer_version: "2.1.0"

reporting:
  slices:
    - routine
    - multi_step
    - distractor
    - counterfactual
  include_item_counts: true
  include_uncertainty: true
  include_latency_and_cost: true
  retain_raw_outputs: true

security:
  secrets_source: environment
  redact_credentials_from_logs: true
  run_untrusted_code_in_sandbox: true
