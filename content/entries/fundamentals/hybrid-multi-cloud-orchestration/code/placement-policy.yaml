apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: checkout-api-placement
  namespace: checkout
spec:
  resourceSelectors:
    - apiVersion: apps/v1
      kind: Deployment
      name: checkout-api
    - apiVersion: v1
      kind: Service
      name: checkout-api
  propagateDeps: true
  placement:
    clusterAffinity:
      labelSelector:
        matchLabels:
          workload.example.com/data-boundary: eu
          workload.example.com/runtime-contract: portable-v2
    spreadConstraints:
      - spreadByField: provider
        minGroups: 2
        maxGroups: 2

# The policy places stateless compute. It deliberately does not claim that a
# database, identity boundary, network route, or provider-managed dependency is
# portable. Those resources need separate ownership and recovery policies.
