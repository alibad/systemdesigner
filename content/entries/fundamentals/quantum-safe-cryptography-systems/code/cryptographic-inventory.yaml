assets:
  - id: research-archive
    owner: research-platform
    purpose: confidentiality
    protection_horizon_years: 20
    uses:
      - protocol: tls
        role: key-establishment
        library: openssl
        locations: [ingest-gateway, export-worker]
    dependencies:
      - certificate-profile
      - client-compatibility
      - key-management-service
    migration:
      target: ML-KEM-768
      mode: negotiated-dual-stack
      rollback: classical-profile
      evidence_required:
        - interoperability-suite
        - latency-envelope
        - malformed-input-tests

  - id: firmware-trust-root
    owner: device-security
    purpose: authenticity
    protection_horizon_years: 15
    uses:
      - protocol: signed-manifest
        role: verification
        locations: [bootloader, recovery-image]
    migration:
      target: ML-DSA-65
      mode: dual-trust-root
      rollback: recovery-key
      evidence_required:
        - boot-chain-test
        - key-rotation-drill
        - revoked-key-test
