groups:
  - name: checkout-path-baseline
    interval: 30s
    rules:
      - record: service:http_requests:rate5m
        expr: |
          sum by (service, route) (
            rate(http_server_request_duration_seconds_count[5m])
          )

      - record: service:http_request_duration:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, route, le) (
              rate(http_server_request_duration_seconds_bucket[5m])
            )
          )

      - record: service:http_errors:ratio5m
        expr: |
          sum by (service, route) (
            rate(http_server_request_duration_seconds_count{status_code=~"5.."}[5m])
          )
          /
          sum by (service, route) (
            rate(http_server_request_duration_seconds_count[5m])
          )

      - record: service:worker_queue_age:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, route, le) (
              rate(worker_queue_age_seconds_bucket[5m])
            )
          )

      - record: service:db_pool_acquire:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, pool, le) (
              rate(db_client_connection_acquire_duration_seconds_bucket[5m])
            )
          )
