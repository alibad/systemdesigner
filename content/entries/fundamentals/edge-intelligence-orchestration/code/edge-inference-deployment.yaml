apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-inspection
  labels:
    app.kubernetes.io/name: quality-inspection
    edge.example.com/release-ring: canary
  annotations:
    edge.example.com/model-digest: sha256:6f9030e7...
    edge.example.com/input-signature: camera-rgb-v3
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quality-inspection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quality-inspection
    spec:
      tolerations:
        - key: edge.example.com/dedicated
          operator: Equal
          value: inference
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: edge.example.com/site
                    operator: In
                    values: [factory-a]
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: In
                    values: ["true"]
      containers:
        - name: inference
          image: registry.example.com/edge/quality-inspection@sha256:90ed9188...
          args:
            - --model=/models/quality-v42.onnx
            - --expected-opset=19
            - --fallback=/models/quality-v41.onnx
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
              example.com/accelerator: "1"
            limits:
              memory: 3Gi
              example.com/accelerator: "1"
          readinessProbe:
            httpGet:
              path: /ready/model-contract
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
