policyVersion: remediation-v7
owner: platform-reliability

evidence:
  minimumIndependentSignals: 2
  requireFreshServiceSli: true
  maximumTelemetryAgeSeconds: 60

authority:
  replaceInstance:
    maximumScopePercent: 5
    requiresApproval: false
  rollbackRelease:
    maximumScopePercent: 10
    requiresApproval: false
  regionalFailover:
    maximumScopePercent: 100
    requiresApproval: true

execution:
  concurrency: 1
  maximumAttempts: 2
  cooldownSeconds: 300
  requireIdempotencyKey: true
  requireTestedRollback: true

verification:
  compareAgainstControl: true
  observationWindowSeconds: 600
  rollbackOnSloRegression: true
  escalateOnUnknownOutcome: true
