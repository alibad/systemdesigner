version: 1

actions:
  optional-personalization:
    authority: explicit-user-choice
    required_controls:
      - purpose-specific-notice
      - refusal-keeps-core-service
      - revoke-choice
    evidence:
      - policy-version
      - recorded-choice
      - effective-time

  delete-shared-workspace:
    authority: authorized-owner-confirmation
    required_controls:
      - review-before-commit
      - delayed-execution
      - restore-path
    evidence:
      - actor
      - affected-resources
      - deletion-deadline

  ai-assisted-fraud-hold:
    authority: human-reviewer
    automation_ceiling: recommend
    required_controls:
      - reason-and-supporting-evidence
      - reachable-escalation
      - appeal-path
    evidence:
      - model-and-policy-version
      - reviewer
      - final-reason
      - later-corrections
