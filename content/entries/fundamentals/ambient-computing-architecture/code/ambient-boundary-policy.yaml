behavior: occupied-room-lighting
purpose: adjust-lighting-for-current-occupancy

signals:
  - id: motion
    process: device
    retain: 30s
  - id: door-transition
    process: gateway
    retain: 5m

decision:
  location: gateway
  evidence_threshold: 0.80
  maximum_authority: automatic-reversible
  stale_after: 2m

fallback:
  cloud_offline: continue-local-policy
  sensor_stale: require-manual-control
  audit: publish-local-event
