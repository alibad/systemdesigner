---
- name: Configure the checkout API
  hosts: "webservers:&production"
  become: true

  tasks:
    - name: Install the reviewed checkout configuration
      ansible.builtin.template:
        src: checkout-api.conf.j2
        dest: /etc/checkout-api/config.conf
        owner: root
        group: checkout
        mode: "0640"
      notify: Restart checkout API

    - name: Ensure the checkout API is enabled and running
      ansible.builtin.service:
        name: checkout-api
        enabled: true
        state: started

  handlers:
    - name: Restart checkout API
      ansible.builtin.service:
        name: checkout-api
        state: restarted
