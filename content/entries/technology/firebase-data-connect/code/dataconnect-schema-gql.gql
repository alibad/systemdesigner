# Application schema: SQL Connect maps these types to PostgreSQL tables.
type User @table {
  id: String! @default(expr: "auth.uid")
  displayName: String! @col(dataType: "varchar(80)")
  createdAt: Timestamp! @default(expr: "request.time")
}

type Product @table {
  id: UUID! @default(expr: "uuidV4()")
  title: String! @col(dataType: "varchar(160)")
  category: String! @col(dataType: "varchar(40)")
  priceCents: Int!
  available: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
}

# SQL Connect infers userId and productId foreign-key fields.
# The compound key prevents the same user-product pair from appearing twice.
type Favorite @table(key: ["user", "product"]) {
  user: User!
  product: Product!
  createdAt: Timestamp! @default(expr: "request.time")
}
