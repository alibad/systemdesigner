# Public catalog data is explicitly bounded and intentionally public.
query ListCatalog($category: String!, $limit: Int = 24)
  @auth(
    level: PUBLIC
    insecureReason: "Product summaries are intentionally public."
  ) {
  products(
    where: {
      category: { eq: $category }
      available: { eq: true }
    }
    orderBy: [{ title: ASC }]
    limit: $limit
  ) {
    id
    title
    priceCents
  }
}

# The owner comes from the verified request, never from a client userId.
query ListMyFavorites($limit: Int = 40) @auth(level: USER) {
  favorites(
    where: { userId: { eq_expr: "auth.uid" } }
    orderBy: [{ createdAt: DESC }]
    limit: $limit
  ) {
    createdAt
    product {
      id
      title
      priceCents
      available
    }
  }
}

mutation AddFavorite($productId: UUID!) @auth(level: USER) {
  favorite_upsert(
    data: {
      userId_expr: "auth.uid"
      productId: $productId
    }
  )
}
