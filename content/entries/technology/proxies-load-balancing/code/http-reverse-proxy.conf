# L7 reverse proxy: terminate client TLS, normalize identity, reuse upstream
# connections, and verify a separate TLS connection to each application target.

upstream checkout_pool {
    zone checkout_pool 64k;
    least_conn;

    server 10.20.1.10:8443 max_fails=3 fail_timeout=10s;
    server 10.20.2.10:8443 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 443 ssl;
    server_name checkout.example.com;

    ssl_certificate     /etc/nginx/tls/checkout.crt;
    ssl_certificate_key /etc/nginx/tls/checkout.key;

    location / {
        proxy_pass https://checkout_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;

        # This is the first trusted edge, so replace caller-supplied identity.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 500ms;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        # NGINX does not retry non-idempotent methods unless explicitly enabled.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;

        proxy_ssl_server_name on;
        proxy_ssl_name checkout.internal.example;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/tls/internal-ca.pem;
    }
}
