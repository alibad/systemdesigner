# L4 TLS pass-through: HAProxy selects a TCP target, while the application
# terminates TLS. PROXY v2 is safe only when receivers trust this HAProxy hop.

global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 1s
    timeout client 30s
    timeout server 30s

frontend public_tls
    bind :443
    default_backend application_tls

backend application_tls
    balance leastconn
    option tcp-check

    server app-a1 10.20.1.10:443 check inter 2s fall 3 rise 2 send-proxy-v2
    server app-a2 10.20.1.11:443 check inter 2s fall 3 rise 2 send-proxy-v2
    server app-b1 10.20.2.10:443 check inter 2s fall 3 rise 2 send-proxy-v2
    server app-b2 10.20.2.11:443 check inter 2s fall 3 rise 2 send-proxy-v2
