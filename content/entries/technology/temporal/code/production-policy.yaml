# Application-owned review policy. Wire these values into SDK and deployment code.
namespace: orders-production
taskQueue: orders-v1

workerDeployment:
  deploymentName: order-worker
  buildId: "${GIT_SHA}"
  replicas: 6
  gracefulShutdown: 30s
  rollout:
    useWorkerVersioning: true
    replayHistoriesBeforeRamp: true

activityDefaults:
  startToClose: 30s
  scheduleToClose: 5m
  heartbeatTimeout: 15s
  retry:
    initialInterval: 1s
    backoffCoefficient: 2
    maximumInterval: 30s
    maximumAttempts: 5

operations:
  internalHistoryBudgetEvents: 20000
  alerts:
    - activity_schedule_to_start_p95_over_10s
    - no_pollers_for_2m
    - workflow_task_failures_over_1_percent
    - reconciliation_backlog_over_15m
