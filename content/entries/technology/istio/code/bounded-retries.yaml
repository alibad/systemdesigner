apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: inventory
  namespace: shop
spec:
  hosts:
    - inventory.shop.svc.cluster.local
  http:
    # Only idempotent reads receive the retry policy.
    - name: inventory-reads
      match:
        - method:
            exact: GET
      route:
        - destination:
            host: inventory.shop.svc.cluster.local
      timeout: 1500ms
      retries:
        attempts: 2
        perTryTimeout: 400ms
        retryOn: connect-failure,reset,refused-stream,503
    # Writes share the outer deadline but are not repeated by the mesh.
    - name: inventory-writes
      route:
        - destination:
            host: inventory.shop.svc.cluster.local
      timeout: 1500ms
