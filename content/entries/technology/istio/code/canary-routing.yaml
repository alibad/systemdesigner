apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: catalog
  namespace: shop
spec:
  host: catalog.shop.svc.cluster.local
  subsets:
    - name: stable
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/version: v1
    - name: canary
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: catalog
  namespace: shop
spec:
  hosts:
    - catalog.shop.svc.cluster.local
  http:
    # Specific matches must come before the catch-all route.
    - name: internal-canary
      match:
        - headers:
            x-release-channel:
              exact: canary
      route:
        - destination:
            host: catalog.shop.svc.cluster.local
            subset: canary
    - name: production-split
      route:
        - destination:
            host: catalog.shop.svc.cluster.local
            subset: stable
          weight: 95
        - destination:
            host: catalog.shop.svc.cluster.local
            subset: canary
          weight: 5
