apiVersion: 1

prune: true
datasources:
  - name: Production Prometheus
    uid: prometheus-production
    type: prometheus
    access: proxy
    url: https://prometheus.internal.example.com
    isDefault: true
    editable: false
    version: 3
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      manageAlerts: true
      alertmanagerUid: alertmanager-production
      tlsAuthWithCACert: true
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: Bearer ${PROMETHEUS_QUERY_TOKEN}
      tlsCACert: ${OBSERVABILITY_CA_CERT}
