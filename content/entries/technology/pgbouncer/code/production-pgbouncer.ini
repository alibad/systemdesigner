[databases]
app = host=postgres-writer.internal port=5432 dbname=app

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

# Capacity: verify the total across every PgBouncer instance and (database, user) pool.
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 24
reserve_pool_size = 6
reserve_pool_timeout = 3
max_db_connections = 90
query_wait_timeout = 8

# Connection rotation and failed-login retry.
server_connect_timeout = 5
server_login_retry = 3
server_idle_timeout = 300
server_lifetime = 1800

# Set explicitly and integration-test the client driver's protocol behavior.
max_prepared_statements = 200
server_reset_query = DISCARD ALL

# Client -> PgBouncer authentication and encryption.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
client_tls_sslmode = require
client_tls_key_file = /etc/pgbouncer/tls/pgbouncer.key
client_tls_cert_file = /etc/pgbouncer/tls/pgbouncer.crt

# PgBouncer -> PostgreSQL encryption and server identity.
server_tls_sslmode = verify-full
server_tls_ca_file = /etc/pgbouncer/tls/postgres-ca.crt

admin_users = pgbouncer_admin
stats_users = pgbouncer_metrics
stats_period = 60
