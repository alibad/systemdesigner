input_features:
  - name: ticket_text
    type: text
    preprocessing:
      missing_value_strategy: fill_with_const
      fill_value: ""
  - name: product_area
    type: category
  - name: customer_tier
    type: category

output_features:
  - name: destination_queue
    type: category

combiner:
  type: concat

trainer:
  epochs: 30
  early_stop: 5
  batch_size: 128
  learning_rate: 0.001

preprocessing:
  split:
    type: fixed
    column: entity_split
