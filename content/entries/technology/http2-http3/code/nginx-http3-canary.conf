# Requires nginx with the HTTP/2 and HTTP/3 modules.
# Verify module maturity and TLS-library support for the deployed nginx version.
http {
  log_format protocol_json escape=json
    '{"time":"$time_iso8601","request":"$request",'
    '"status":$status,"seconds":$request_time,'
    '"http2":"$http2","http3":"$http3"}';

  server {
    # TCP carries HTTP/1.1 and HTTP/2; UDP carries HTTP/3 on the same port.
    listen 443 ssl;
    listen 443 quic reuseport;
    http2 on;
    http3 on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/tls/example.crt;
    ssl_certificate_key /etc/nginx/tls/example.key;

    # Persist token protection across reloads and validate new client addresses.
    quic_host_key /etc/nginx/quic-host.key;
    quic_retry on;

    access_log /var/log/nginx/protocol-access.json protocol_json;

    location / {
      proxy_pass http://application;

      # Start with a short cache lifetime; lengthen only after fallback is healthy.
      add_header Alt-Svc 'h3=":443"; ma=300' always;
    }
  }
}
