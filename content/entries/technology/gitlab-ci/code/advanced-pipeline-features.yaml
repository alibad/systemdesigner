deploy-production:
  stage: deploy
  image: registry.example.com/platform/deployer:3.4.1
  tags:
    - deploy-production
  needs:
    - job: build-application
      artifacts: true
  id_tokens:
    DEPLOY_ID_TOKEN:
      aud: https://deploy-broker.example.com
  environment:
    name: production
    url: https://app.example.com
    deployment_tier: production
  resource_group: production
  interruptible: false
  when: manual
  manual_confirmation: "Deploy the verified artifact to production?"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - test -n "$DEPLOY_ID_TOKEN"
    - ./scripts/deploy-production.sh
        --artifact dist/
        --revision "$CI_COMMIT_SHA"
        --identity-token "$DEPLOY_ID_TOKEN"
