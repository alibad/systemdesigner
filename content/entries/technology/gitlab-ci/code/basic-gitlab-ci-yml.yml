workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never

stages:
  - verify
  - build
  - publish

default:
  image: node:22-alpine
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

lint:
  stage: verify
  needs: []
  script:
    - npm run lint

unit-test:
  stage: verify
  needs: []
  script:
    - npm test -- --ci --reporters=default --reporters=jest-junit
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: junit.xml

build-application:
  stage: build
  needs:
    - lint
    - unit-test
  script:
    - npm run build
    - printf '%s' "$CI_COMMIT_SHA" > dist/REVISION
  artifacts:
    expire_in: 7 days
    paths:
      - dist/

publish-package:
  stage: publish
  needs:
    - job: build-application
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - ./scripts/publish-package.sh dist/ "$CI_COMMIT_TAG"
