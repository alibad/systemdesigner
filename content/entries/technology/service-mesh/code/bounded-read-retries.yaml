apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: catalog
  namespace: shop
spec:
  hosts:
    - catalog.shop.svc.cluster.local
  http:
    - name: idempotent-reads
      match:
        - method:
            exact: GET
      route:
        - destination:
            host: catalog.shop.svc.cluster.local
      timeout: 1500ms
      retries:
        attempts: 2
        perTryTimeout: 400ms
        retryOn: gateway-error,connect-failure,refused-stream
    - name: writes-without-mesh-retries
      route:
        - destination:
            host: catalog.shop.svc.cluster.local
      timeout: 1500ms
