groups:
  - name: api-recording
    interval: 30s
    rules:
      - record: job_service:http_requests:rate5m
        expr: |
          sum by (job, service) (
            rate(http_requests_total{job="api"}[5m])
          )

      - record: job_service:http_request_errors:rate5m
        expr: |
          sum by (job, service) (
            rate(http_requests_total{job="api", status=~"5.."}[5m])
          )

  - name: api-alerts
    interval: 30s
    rules:
      - alert: ApiHighErrorRatio
        expr: |
          (
            job_service:http_request_errors:rate5m
            /
            job_service:http_requests:rate5m
          ) > 0.02
          and on (job, service)
          job_service:http_requests:rate5m > 1
        for: 10m
        labels:
          severity: page
          team: platform
        annotations:
          summary: "{{ $labels.service }} has a sustained high error ratio"
          description: "More than 2% of requests have failed for 10 minutes. Current ratio: {{ $value | humanizePercentage }}."
          runbook_url: https://runbooks.example.com/api/high-error-ratio

      - alert: ApiTargetDown
        expr: up{job="api"} == 0
        for: 5m
        labels:
          severity: ticket
          team: platform
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.instance }}"
          description: "The API target has failed every scrape for five minutes."
          runbook_url: https://runbooks.example.com/prometheus/target-down
