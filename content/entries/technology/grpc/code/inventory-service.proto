syntax = "proto3";

package inventory.v1;

option go_package = "example.com/inventory/gen/inventory/v1;inventoryv1";

import "inventory/v1/inventory-messages.proto";

service InventoryService {
  // Read-only unary lookup. The service config may retry UNAVAILABLE.
  rpc GetItem(GetItemRequest) returns (GetItemResponse);

  // The server emits ordered snapshots until completion or cancellation.
  rpc WatchInventory(WatchInventoryRequest) returns (stream InventoryEvent);

  // The client uploads a bounded sequence and receives one summary.
  rpc UploadAdjustments(stream InventoryAdjustment) returns (UploadSummary);

  // Both peers send ordered messages independently within one RPC.
  rpc SyncInventory(stream SyncRequest) returns (stream SyncResponse);

  // Mutation safety comes from a required, durable idempotency key.
  rpc ReserveInventory(ReserveInventoryRequest) returns (ReserveInventoryResponse);
}
