syntax = "proto3";

package inventory.v1;

option go_package = "example.com/inventory/gen/inventory/v1;inventoryv1";

import "google/protobuf/timestamp.proto";

enum InventoryState {
  INVENTORY_STATE_UNSPECIFIED = 0;
  INVENTORY_STATE_AVAILABLE = 1;
  INVENTORY_STATE_RESERVED = 2;
  INVENTORY_STATE_BACKORDERED = 3;
}

message Item {
  string sku = 1;
  int64 available_units = 2;

  // Field 3 used to carry a warehouse name. Never reuse its identity.
  reserved 3;
  reserved "warehouse";

  optional string display_name = 4;
  InventoryState state = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetItemRequest {
  string sku = 1;
}

message GetItemResponse {
  Item item = 1;
  string version = 2;
}

message WatchInventoryRequest {
  repeated string skus = 1;
  optional string resume_token = 2;
}

message InventoryEvent {
  Item item = 1;
  string resume_token = 2;
}

message InventoryAdjustment {
  string adjustment_id = 1;
  string sku = 2;
  sint64 unit_delta = 3;
}

message UploadSummary {
  uint32 accepted = 1;
  uint32 rejected = 2;
}

message SyncRequest {
  oneof payload {
    WatchInventoryRequest subscribe = 1;
    string acknowledge_resume_token = 2;
  }
}

message SyncResponse {
  oneof payload {
    InventoryEvent event = 1;
    string heartbeat_id = 2;
  }
}

message ReserveInventoryRequest {
  string idempotency_key = 1;
  string sku = 2;
  uint32 units = 3;
}

message ReserveInventoryResponse {
  string reservation_id = 1;
  InventoryState state = 2;
}
