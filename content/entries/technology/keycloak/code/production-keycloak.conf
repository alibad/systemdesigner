# Assumption: TLS terminates at a trusted edge proxy.
# The proxy reaches Keycloak over a private HTTP network and overwrites X-Forwarded-*.

db=postgres
hostname=https://id.example.com
hostname-admin=https://id-admin.example.net

http-enabled=true
proxy-headers=xforwarded
proxy-trusted-addresses=10.20.0.0/16

health-enabled=true
metrics-enabled=true
http-management-host=0.0.0.0
http-management-port=9000

# Supply KC_DB_URL, KC_DB_USERNAME, KC_DB_PASSWORD, and TLS material through
# the deployment platform's protected configuration, not this file.
