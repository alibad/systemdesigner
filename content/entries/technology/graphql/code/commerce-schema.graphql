scalar Cursor

type Query {
  product(id: ID!): Product
  products(first: Int! = 20, after: Cursor): ProductConnection!
}

type Product {
  id: ID!
  name: String!
  priceCents: Int!
  reviewSummary: ReviewSummary
}

type ReviewSummary {
  averageRating: Float!
  totalReviews: Int!
}

type ProductConnection {
  edges: [ProductEdge!]!
  pageInfo: PageInfo!
}

type ProductEdge {
  cursor: Cursor!
  node: Product!
}

type PageInfo {
  endCursor: Cursor
  hasNextPage: Boolean!
}

input AddCartItemInput {
  cartId: ID!
  productId: ID!
  quantity: Int!
  idempotencyKey: ID!
}

type AddCartItemPayload {
  cart: Cart
  userErrors: [UserError!]!
}

type Cart {
  id: ID!
  itemCount: Int!
}

type UserError {
  code: String!
  message: String!
  field: [String!]
}

type Mutation {
  addCartItem(input: AddCartItemInput!): AddCartItemPayload!
}
