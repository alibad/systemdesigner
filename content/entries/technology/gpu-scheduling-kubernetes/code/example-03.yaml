apiVersion: batch/v1
kind: Job
metadata:
  name: image-embedding-batch
  namespace: ml-team
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: image-embedding-batch
    spec:
      restartPolicy: Never
      priorityClassName: gpu-batch
      tolerations:
        - key: accelerator
          operator: Equal
          value: nvidia
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [A100-SXM4-80GB]
      containers:
        - name: worker
          image: registry.example.com/ml/image-embedder@sha256:REPLACE_WITH_DIGEST
          args: ["--input", "/data/manifest.jsonl", "--checkpoint-dir", "/checkpoints"]
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              ephemeral-storage: 20Gi
            limits:
              cpu: "8"
              memory: 64Gi
              ephemeral-storage: 20Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            exec:
              command: ["/app/ready-check"]
            initialDelaySeconds: 20
            periodSeconds: 10
