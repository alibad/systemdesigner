apiVersion: v1
kind: ResourceQuota
metadata:
  name: gpu-budget
  namespace: ml-team
spec:
  hard:
    limits.nvidia.com/gpu: "16"
    limits.nvidia.com/gpu.shared: "32"
    requests.cpu: "128"
    requests.memory: 1Ti
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: gpu-online
value: 10000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: Latency-sensitive GPU services with an approved disruption policy.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: gpu-batch
value: 1000
globalDefault: false
preemptionPolicy: Never
description: Restartable batch GPU work that must not evict other Pods.
