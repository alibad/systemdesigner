apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-device-plugin-config
  namespace: gpu-operator
data:
  shared-inference: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: true
        failRequestsGreaterThanOne: true
        resources:
          - name: nvidia.com/gpu
            replicas: 4

# Configure the installed NVIDIA device plugin or GPU Operator to consume this
# ConfigMap, then label only the intended nodes with the selected config name.
# renameByDefault advertises nvidia.com/gpu.shared so Pods choose sharing explicitly.
