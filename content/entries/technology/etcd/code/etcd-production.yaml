name: etcd-1
data-dir: /var/lib/etcd

listen-client-urls: https://10.20.0.11:2379
advertise-client-urls: https://10.20.0.11:2379
listen-peer-urls: https://10.20.0.11:2380
initial-advertise-peer-urls: https://10.20.0.11:2380
initial-cluster: etcd-1=https://10.20.0.11:2380,etcd-2=https://10.20.0.12:2380,etcd-3=https://10.20.0.13:2380
initial-cluster-state: new
initial-cluster-token: coordination-prod-v1

quota-backend-bytes: 8589934592
auto-compaction-mode: periodic
auto-compaction-retention: 1h

cert-file: /etc/etcd/pki/server.crt
key-file: /etc/etcd/pki/server.key
trusted-ca-file: /etc/etcd/pki/ca.crt
client-cert-auth: true

peer-cert-file: /etc/etcd/pki/peer.crt
peer-key-file: /etc/etcd/pki/peer.key
peer-trusted-ca-file: /etc/etcd/pki/ca.crt
peer-client-cert-auth: true

logger: zap
log-level: info
